spring.application.name=survey
server.port=5170

# DB 접속정보/jwt.secret 등 민감정보는 프로젝트 루트의 .env(gitignore 대상)에서 불러옵니다.
spring.config.import=optional:file:.env[.properties]

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/survey?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#logging.level.org.hibernate.SQL=debug
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

logging.level.root=INFO
logging.level.com.surveyplus=DEBUG

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

jwt.secret=${JWT_SECRET}