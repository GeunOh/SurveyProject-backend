spring.application.name=survey
server.port=5170

spring.config.import=optional:file:.env[.properties]

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/survey?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#logging.level.org.hibernate.SQL=debug
#logging.level.org.hibernate.orm.jdbc.bind=trace

logging.level.root=INFO
logging.level.com.surveyplus=DEBUG

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

jwt.secret=${JWT_SECRET}
share.secret=${SHARE_SECRET}

cors.allowed-origins=http://localhost:5173,http://14.39.76.82:5173

cookie.secure=false